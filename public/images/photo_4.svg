<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
    <defs>
      <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#84fab0" />
        <stop offset="100%" stop-color="#8fd3f4" />
      </linearGradient>
      <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="rgba(0,0,0,0.25)"/>
      </filter>
    </defs>
    <!-- Background Frame / Polaroid -->
    <rect width="800" height="1000" fill="#ffffff" rx="28"/>
    <!-- Inner Border Line -->
    <rect x="18" y="18" width="764" height="964" fill="none" stroke="#f0ede6" stroke-width="2" rx="20"/>
    
    <!-- Inner Image Area -->
    <rect x="36" y="36" width="728" height="740" rx="20" fill="url(#grad4)"/>
    
    <!-- Decorative Rings -->
    <circle cx="400" cy="370" r="220" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2" stroke-dasharray="8 8"/>
    <circle cx="400" cy="370" r="160" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
    
    <!-- Big Romantic Icon -->
    <text x="400" y="350" font-size="130" text-anchor="middle" filter="url(#shadow4)">🌊</text>
    
    <!-- Memory Number Tag -->
    <rect x="310" y="80" width="180" height="46" rx="23" fill="rgba(255,255,255,0.92)" filter="url(#shadow4)"/>
    <text x="400" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" fill="#ff4b72" text-anchor="middle" letter-spacing="2">KỶ NIỆM #4</text>
    
    <!-- Title inside image -->
    <text x="400" y="520" font-family="'Georgia', serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#shadow4)">Chuyến Đi Xa Đầu Tiên</text>
    <text x="400" y="575" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="rgba(255,255,255,0.92)" text-anchor="middle">📅 30/04/2023</text>
    
    <!-- Bottom Note Section (Polaroid style) -->
    <text x="400" y="845" font-family="'Georgia', serif" font-style="italic" font-size="22" fill="#333333" text-anchor="middle">"Biển xanh, cát trắng và em - bức tranh đẹp nhất đời anh."</text>
    <text x="400" y="915" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" fill="#888888" text-anchor="middle">♥ Chạm vào để phóng to kỷ niệm ♥</text>
  </svg>